# ── WHAT THIS FILE IS, AND WHAT IT IS NOT ────────────────────────────
#
# THIS BLUEPRINT WAS NEVER APPLIED. The services it describes were created by
# hand in the dashboard on 2026-08-14, and for eight days this file described a
# deployment that did not exist:
#
#   - it named the web service `revelle`; the real one is `dispatcherie`
#   - it declared a database `revelle-db`; the real one is `dispatcherie-db`
#   - and the live service had NO preDeployCommand at all, so `npm run migrate`
#     and every seeder below had never once run automatically
#
# The consequence was invisible and total: code deployed on every push and the
# DATABASE NEVER MOVED. Schema changes and catalogue content sat in the repo
# looking shipped.
#
# A second service — a static_site also called `revelle`, built from this same
# repo and branch — served a stale artifact at revelle.onrender.com, which is
# the URL anybody would guess. It has been deleted.
#
# So this file is now reconciled to reality and is DOCUMENTATION OF A RUNNING
# SYSTEM, not a blueprint waiting to be applied. Applying it as a blueprint
# would create duplicates of services that already exist. Change the dashboard
# and change this file in the same commit, or it goes back to being fiction.
# ─────────────────────────────────────────────────────────────────────

# Revelle Société — Render Blueprint
#
# One web service (Render's native Node runtime) + one Render Postgres.
#
# ─────────────────────────────────────────────────────────────────────
# THE RULE THIS FILE EXISTS TO ENFORCE
#
# No step of the pipeline may depend on a developer's machine. The database
# below has an empty ipAllowList — it is unreachable from the internet — and
# migrations run as this service's preDeployCommand, inside Render, on the
# private network. There is no step anyone has to remember to run locally, and
# no laptop that has to be online for a deploy to be correct.
# ─────────────────────────────────────────────────────────────────────

databases:
  - name: dispatcherie-db
    databaseName: revelle
    user: revelle
    # basic-256mb is the cheapest non-expiring plan. `free` also works but is
    # deleted after 30 days, which is not a thing to build a datastore on.
    plan: basic-256mb
    postgresMajorVersion: "17"
    # Empty list = no public internet access; only Render services in the same
    # region can reach it. It stays this way. See the rule above.
    ipAllowList: []
    region: oregon

services:
  - type: web
    name: dispatcherie
    runtime: node
    plan: starter
    # Must match the database's region, or DATABASE_URL's internal hostname
    # will not resolve.
    region: oregon
    branch: main

    # Content lives in Postgres, not in git, so every push to main is a genuine
    # code change worth deploying.
    autoDeploy: true

    healthCheckPath: /

    # `npm ci`, not `npm install`, so the committed lockfile is authoritative.
    buildCommand: npm ci && npm run build
    startCommand: npm run start

    # ── Database setup runs HERE ──────────────────────────────────────
    #
    # preDeployCommand runs once per deploy, after the build and before any new
    # instance takes traffic, with this service's environment — including the
    # internal DATABASE_URL. That is the only place the database is reachable
    # from, which is exactly the point.
    #
    # `npm run migrate` is scripts/migrate.mjs: it applies any db/*.sql not yet
    # in the schema_migrations ledger, adopting files whose objects a pre-ledger
    # database already has, under an advisory lock so two concurrent deploys
    # cannot double-apply. It is idempotent — a no-op once the database is
    # current — so running it on every deploy is free.
    #
    # A non-zero exit here FAILS THE DEPLOY: the old instance keeps serving and
    # the new code is never promoted. Code that expects a column the database
    # does not have must not ship.
    #
    # ── AND THAT CORRECT BEHAVIOUR IS WHAT WENT WRONG ────────────────
    #
    # db/032 carried an assertion that could never be true. It raised on every
    # database, `npm run migrate` exited non-zero, Render failed the deploy,
    # and the old instance kept serving — every step of that is the system
    # working. It was also completely silent. For four weeks the running code
    # was old, the database was old, every screen agreed with itself, db/033
    # through 036 never applied and the seven seeders below never once ran.
    # It surfaced as a destination count that looked wrong on a dashboard.
    #
    # A FAILED DEPLOY IS NOT SELF-ANNOUNCING. Three things now make it one,
    # and it is worth being precise about which layer catches what — because a
    # warning system that is itself silent when it breaks is the bug above
    # wearing a hat.
    #
    #   1. CI, .github/workflows/smoke.yml. The whole chain, including this
    #      migration step, against a throwaway postgres:17 on every push and
    #      pull request. This is the layer that actually PREVENTS db/032:
    #      an assertion that has never executed has never been wrong, and CI
    #      executes it before the commit can reach a deploy at all.
    #
    #   2. THE RUN RECORD. scripts/migrate.mjs writes one row per invocation
    #      into `schema_migration_run` — what applied, which file failed, which
    #      migrations never ran behind it, and which of the seeder steps below
    #      were cancelled by it. It is written by the FAILING deploy, into the
    #      one thing that deploy shares with the instance still serving.
    #
    #   3. THE DESK. src/lib/desk/schema.ts reads that row on every /desk
    #      request and src/app/desk/(signed-in)/layout.tsx puts it on screen:
    #      a line in the rail in every state, and a banner across every page
    #      when the database is behind, a run failed, or the check cannot tell.
    #
    # ── WHAT RENDER ITSELF CANNOT BE MADE TO DO, SAID PLAINLY ────────
    #
    # There is no post-deploy hook, and no way to express "notify a human on
    # pre-deploy failure" in this file. Render does send deploy-failure
    # notifications, but they are a DASHBOARD SETTING on the service — they
    # cannot be committed here, this repo cannot verify they are switched on,
    # and a blueprint that pretended otherwise would be fiction of exactly the
    # kind the header of this file was written to end. So: turn them on in the
    # dashboard, and do not treat that as the mechanism. Layers 1–3 above are
    # the mechanism, because they are the parts that live in the repo.
    #
    # And the honest limit of layer 3: A BANNER IS PULL, NOT PUSH. It is seen
    # when somebody opens the desk. What it guarantees is that the question is
    # answerable by LOOKING rather than by archaeology — not that anyone is
    # looking. Nothing in this file can guarantee the second.
    # Migrate, then SEED. Both run inside Render on the private network, which
    # is the only place the database is reachable from — see the rule at the
    # top of this file.
    #
    # The seeds are here rather than run by hand because a hand-run step is a
    # step that does not happen: the catalogue was authored, committed and
    # migrated for a day before anyone noticed the live database had none of
    # it. Every seeder is idempotent (a re-run reports "0 created, 0 updated"),
    # so running them on every deploy costs nothing and cannot drift.
    #
    # seed:destinations runs TWICE on purpose. The menu, drink and dish seeders
    # create a draft stub for a destination that has content but no authored
    # look — and seed:destinations is what completes a stub once someone
    # writes it. First pass publishes what is authored, the seeders attach the
    # content, second pass adopts anything new.
    #
    # seed:bank added 2026-08-23. It creates six DRAFT world stubs — Oaxaca,
    # Acapulco, St. Moritz, Aspen, Palm Springs, Amalfi — for admitted rooms
    # whose voices are drafted or whose schedule cells are founder-pending.
    # That is the system working rather than a decision being made: a draft
    # world is invisible to selection and to members, and the desk is exactly
    # where a proposed room belongs so it can be SEEN. The rule was never
    # "nothing new reaches the desk"; it is "nothing reaches a member".
    #
    # Rio and Cap Ferrat are NOT among them and must never be. Rio is blocked
    # with a proof; Cap Ferrat is retired and reserved for a duration tier. A
    # draft row is an invitation to finish something, and those two are
    # deliberately unfinished.
    #
    # Fixtures and demo occasions are deliberately absent: those invent test
    # customers and they refuse a non-local database anyway.
    #
    # tag:catalogue added 2026-08-27, and it runs LAST for the reason the whole
    # step exists. CLAUDE.md rule 22: migrations own schema, seeders own
    # content, and anything COMPUTED OVER CONTENT runs after content exists.
    #
    # db/020 and db/033 derive `ingredient_requirement` rows by matching
    # authored text — `menu.dishes ilike '%grilled%'`, `world.slug in
    # ('tahiti', …)` — and `migrate` is the FIRST link of this chain, so every
    # one of those statements has run against empty tables on every build since
    # it was written. The table is empty on any database built from this file,
    # `venueEligibility()` prunes nothing, and open-flame, full-kitchen and
    # outdoor requirements constrain no package in production today. The
    # migrations looked right, ran clean, raised nothing and did nothing.
    #
    # The same step writes `drink.season_strict`, which seed-drinks has never
    # written, so no drink is season-gated and a February party is offered the
    # summer bar with "Summer" printed on the sheet.
    #
    # IT IS NOT ALONE IN THIS FILE. `npm run check:gates` is the detector for
    # the OTHER failure — a tagger that ran and matched nothing, which reads
    # identically from outside — and it is deliberately NOT in this chain: a
    # thin catalogue is an authoring gap, and failing a deploy on one would
    # block a code fix behind a writing task. It runs in CI and as a db test.
    #
    # /desk/stocked's sync button runs the same steps through
    # src/app/api/desk/seed/route.ts, and src/lib/deploy.test.ts fails if the
    # two lists ever stop naming the same steps in the same order. That guard
    # is new and it caught a live drift on the day it was written: seed:bank
    # was in this chain and not in the route's.
    #
    # A non-zero exit FAILS THE DEPLOY and the old instance keeps serving.
    # ── THIS CHAIN WAS NOT ON THE SERVICE, 2026-08-08 to 2026-08-29 ─────
    #
    # For the whole life of the service the live preDeployCommand was exactly
    # `npm run migrate`. Not a truncated version of the chain below — the
    # first line of it, and nothing after. Every seeder here had never run on
    # deploy, ever.
    #
    # It surfaced when six wired destinations could not be published: five had
    # no world_voice row at all and the sixth had one draft from some other
    # path. The rooms were authored, tested, wired and seeded into `world` by
    # hand; nothing had ever written their voices, because the step that
    # writes them was in this file and not on the service.
    #
    # Rule 20, at full price: THE FILE THAT DESCRIBES THE DEPLOY IS NOT THE
    # DEPLOY. This block's own comment already warned about it in the smaller
    # case — `seed:bank` in the chain and not in the route's, "for four days
    # while it did not" — and the larger case was sitting underneath it the
    # whole time, because nobody read the live value.
    #
    # HOW TO CHECK, and it takes one call:
    #
    #   GET https://api.render.com/v1/services/<id>
    #     -> .serviceDetails.envSpecificDetails.preDeployCommand
    #
    # HOW TO SET IT. PATCH the same URL with the command at
    # `serviceDetails.preDeployCommand` — NOT nested under
    # envSpecificDetails, which is where the GET returns it. Sending it
    # nested returns HTTP 200 and changes nothing, so a caller who trusts the
    # status code will believe it worked. Read it back after writing it.
    #
    preDeployCommand: >-
      npm run migrate &&
      npm run seed:destinations &&
      npm run seed:menus &&
      npm run seed:drinks &&
      npm run seed:dishes &&
      npm run seed:games &&
      npm run seed:bank &&
      npm run seed:destinations &&
      npm run tag:catalogue

    envVars:
      # Next 16 requires Node >= 20.9; 22 is what this is developed against.
      - key: NODE_VERSION
        value: "22"

      # Internal connection string (private network, same region). src/lib/db.ts
      # turns SSL on for any non-localhost host with rejectUnauthorized:false,
      # correct for both Render's internal and external endpoints. If the
      # internal endpoint ever refuses TLS, append ?sslmode=disable — the code
      # already honours that as its escape hatch.
      - key: DATABASE_URL
        fromDatabase:
          name: dispatcherie-db
          property: connectionString

      # The real public origin, no trailing slash. Set after the first deploy to
      # Set to https://revellery.com — the service carries four verified
      # domains: revellery.com, www.revellery.com, dispatcherie.com, www.dispatcherie.com.
      - key: APP_URL
        sync: false

      # The quiz confirmation email. A missing key does NOT fail a submission —
      # her answers are stored either way — but she gets no confirmation and the
      # deploy log says so. MAIL_FROM must be on a Resend-verified domain.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Optional: where a reply to the confirmation lands. The email invites a
      # reply, so this should reach a person.
      - key: MAIL_REPLY_TO
        sync: false

      # THE DESK. Comma-separated addresses of the people who may sign in to
      # /desk. Read on every request by src/lib/staff.ts and FAILS CLOSED: unset
      # or empty means nobody is staff and the segment is unreachable.
      #
      # sync: false because these are personal addresses and must be set in the
      # dashboard rather than committed. Changing the list takes effect at the
      # next request — no deploy, and no migration.
      - key: STAFF_EMAILS
        sync: false

      # The read-only digest token for GET /api/desk/digest. sync: false — it
      # is a secret, and it FAILS CLOSED: unset means the route answers 404.
      - key: DESK_DIGEST_TOKEN
        sync: false

      # Optional, defaults to 10 in src/lib/db.ts.
      # - key: DATABASE_POOL_MAX
      #   value: "10"
